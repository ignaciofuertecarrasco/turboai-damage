[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turboai-damage"
version = "1.0.0"
description = "Damage tolerance of a transonic turbine vane: CFD defect map and a hybrid parametric / surface-graph-network surrogate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["turboai @ git+https://github.com/ignaciofuertecarrasco/TurboAI", "turboai-shape-ml @ git+https://github.com/ignaciofuertecarrasco/turboai-shape-ml", "torch>=2.5", "torch_geometric>=2.6", "nvidia-physicsnemo>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["turboai_damage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
